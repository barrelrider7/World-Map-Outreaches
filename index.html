<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Our locations</title>
<link href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.6.0/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
<style>
  /* These defaults are overwritten by the PALETTE in the script below. */
  :root { --accent:#e8472b; --card-bg:rgba(255,255,255,.94); --ink:#17202a; --ink-soft:#55606c; --space:#12191e; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--space); }
  #stars { position: absolute; top: 0; left: 0; width: 1px; height: 1px; border-radius: 50%; }
  #map { position: absolute; inset: 0; }
  body.idle-cursor, body.idle-cursor * { cursor: none !important; }

  .pin { position: relative; width: 18px; height: 18px; cursor: pointer; }
  .pin::before { content: ""; position: absolute; inset: 3px; background: var(--accent); border: 2px solid #fff; border-radius: 50%; box-shadow: 0 1px 6px rgba(0,0,0,.45); transition: transform .3s; }
  .pin.active::before { transform: scale(1.5); }
  .pin.active::after { content: ""; position: absolute; inset: -6px; border: 2px solid var(--accent); border-radius: 50%; animation: ping 2s ease-out infinite; }
  @keyframes ping { from { transform: scale(.6); opacity: .9; } to { transform: scale(1.8); opacity: 0; } }

  #card { position: absolute; left: clamp(16px, 3vw, 48px); bottom: clamp(16px, 4vh, 56px); width: min(440px, calc(100vw - 32px)); padding: 26px 30px 26px; background: var(--card-bg); backdrop-filter: blur(10px); border-radius: 14px; box-shadow: 0 10px 40px rgba(0,0,0,.35); color: var(--ink); overflow: hidden; transition: opacity .5s; }
  #card.swap { opacity: 0; }
  #card h1 { margin: 0; font-size: clamp(30px, 3.4vw, 52px); line-height: 1.05; letter-spacing: -0.02em; font-weight: 700; }
  #card .sub { margin: 6px 0 0; font-size: clamp(15px, 1.4vw, 20px); color: var(--ink-soft); }
  #card .blurb { margin: 14px 0 0; font-size: clamp(15px, 1.35vw, 19px); line-height: 1.5; }
  #card .facts { margin: 16px 0 0; padding: 0; list-style: none; display: flex; gap: 22px; font-size: clamp(14px, 1.2vw, 17px); color: var(--ink-soft); }
  #card .facts strong { display: block; font-size: clamp(20px, 1.9vw, 28px); color: var(--ink); }
  #bar { position: absolute; left: 0; bottom: 0; height: 4px; width: 100%; background: var(--accent); transform-origin: left; transform: scaleX(0); }
  #bar.run { animation: fill var(--dwell) linear forwards; }
  @keyframes fill { to { transform: scaleX(1); } }

  #list { position: absolute; right: clamp(12px, 2vw, 32px); top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 3px; max-height: 92vh; overflow: auto; scrollbar-width: none; }
  #list button { all: unset; cursor: pointer; padding: 5px 12px; border-radius: 999px; font-size: clamp(12px, 1vw, 15px); color: #fff; background: rgba(13,17,23,.6); backdrop-filter: blur(6px); text-align: right; transition: background .3s; }
  #list button:hover { background: rgba(13,17,23,.85); }
  #list button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  #list button.active { background: var(--accent); }

  #notice { position: absolute; inset: 0; display: none; place-items: center; padding: 24px; text-align: center; color: #fff; font-size: 20px; line-height: 1.5; background: #0d1117; }
  #notice.show { display: grid; }

  .maplibregl-ctrl-attrib { font-size: 11px; }
  @media (prefers-reduced-motion: reduce) { .pin.active::after, #bar.run { animation: none; } }
  @media (max-width: 700px) { #list { display: none; } }
</style>
</head>
<body>
<div id="stars"></div>
<div id="map"></div>
<div id="card" aria-live="polite">
  <h1 id="c-title"></h1>
  <p class="sub" id="c-sub"></p>
  <p class="blurb" id="c-blurb"></p>
  <ul class="facts" id="c-facts"></ul>
  <div id="bar"></div>
</div>
<nav id="list" aria-label="Locations"></nav>
<div id="notice"></div>

<script>
/* =====================================================================
   STEP 1 — LOCATIONS
   One block per location, shown in this order. To add one, copy a whole
   { ... }, block (including the comma at the end) and change the text.
   To remove one, delete its whole block. To change the order, cut and
   paste blocks.

     title        big title on the card
     coordinates  [longitude, latitude]  (NOTE: longitude comes first!)
                  Tip: in Google Maps, right-click a spot and click the
                  numbers at the top of the menu. That copies "lat, lng".
                  Flip them around when you paste them here.
     zoom         how close to fly in. Bigger = closer.
                  About 3.5 for a huge country, 5 for a medium one, 7+ for a tiny one.
     subtitle     (optional) one line under the title, e.g. 'Regional office'
     blurb        (optional) one or two sentences
     facts        (optional) up to three pairs, e.g. [['40', 'people'], ['2019', 'opened']]

   Anything marked optional can be left out or left as '' and it simply
   won't appear on the card.

   The pins are currently placed at each country's capital as a stand-in.
   Replace the coordinates with your real office or project sites.
   ===================================================================== */
const LOCATIONS = [
  { title: 'Washington DC', coordinates: [-77.0369, 38.9072],  zoom: 8   },
  { title: 'Virginia',      coordinates: [-77.4360, 37.5407],  zoom: 6.5 },
  { title: 'Colombia',      coordinates: [-74.0721, 4.7110],   zoom: 4.8 },
  { title: 'Argentina',     coordinates: [-58.3816, -34.6037], zoom: 4   },
  { title: 'Guinea',        coordinates: [-13.6773, 9.6412],   zoom: 5.5 },
  { title: 'Togo',          coordinates: [1.2123, 6.1319],     zoom: 6.5 },
  { title: 'Italy',         coordinates: [12.4964, 41.9028],   zoom: 5   },
  { title: 'Cyprus',        coordinates: [33.3823, 35.1856],   zoom: 7.5 },
  { title: 'Lebanon',       coordinates: [35.5018, 33.8938],   zoom: 7   },
  { title: 'Syria',         coordinates: [36.2765, 33.5138],   zoom: 6   },
  { title: 'Tanzania',      coordinates: [35.7516, -6.1630],   zoom: 5.2 },
  { title: 'Burundi',       coordinates: [29.9306, -3.4271],   zoom: 7   },
  { title: 'South Africa',  coordinates: [28.1881, -25.7479],  zoom: 4.8 },
  { title: 'Eswatini',      coordinates: [31.1367, -26.3054],  zoom: 7.5 },
  { title: 'Pakistan',      coordinates: [73.0479, 33.6844],   zoom: 4.8 },
  { title: 'India',         coordinates: [77.2090, 28.6139],   zoom: 4   },
  { title: 'China',         coordinates: [116.4074, 39.9042],  zoom: 3.8 },
  { title: 'Korea',         coordinates: [126.9780, 37.5665],  zoom: 5.6 },
  { title: 'Japan',         coordinates: [139.6917, 35.6895],  zoom: 4.8 },
  { title: 'Philippines',   coordinates: [120.9842, 14.5995],  zoom: 5   },
  { title: 'Indonesia',     coordinates: [106.8456, -6.2088],  zoom: 4.4 },
  { title: 'West Papua',    coordinates: [134.0640, -0.8615],  zoom: 5.2 },
  { title: 'New Zealand',   coordinates: [174.7762, -41.2865], zoom: 4.6 }
];

/* =====================================================================
   STEP 2 — SETTINGS
   ===================================================================== */
const SETTINGS = {
  dwellSeconds: 10,       // seconds per location (includes the flight there)
  idleResumeSeconds: 45,  // after someone touches the map, the tour restarts after this long
  overview: { center: [20, 22], zoom: 1.9 },   // the zoomed-out "whole world" view
  showList: true,         // the list of names on the right (touch/click to jump). false hides it
  terrainShading: true,   // the soft mountain shadows. false = flatter, lighter on slow devices
  reloadEveryHours: 12    // the page refreshes itself so a TV can run for months
};

/* =====================================================================
   STEP 3 — COLORS
   Hex codes like #4da3e6. Change a value, save, refresh.
   ===================================================================== */
const PALETTE = {
  // Map
  space:     '#12191e',   // the background behind the globe
  ocean:     '#4da3e6',
  land:      '#e6e4d4',   // dry land and deserts
  grass:     '#dbe8b4',
  forest:    '#bcdc9c',
  farmland:  '#e4edc4',
  wetland:   '#cfe3c2',
  ice:       '#f2f6f7',
  borders:   '#c99ca0',
  label:     '#1b2530',   // map text
  halo:      '#ffffff',   // outline around map text so it stays readable
  oceanText: '#d8ecfb',   // sea and ocean names
  glow:      '#8cc4f2',   // atmosphere glow around the globe
  // Pins and card
  accent:    '#e8472b',   // pins, progress bar, highlighted button
  cardBg:    'rgba(255,255,255,.94)',
  ink:       '#17202a',   // card text
  inkSoft:   '#55606c'    // card secondary text
};

/* =====================================================================
   BELOW THIS LINE: the machinery. You shouldn't need to edit it.
   ===================================================================== */

/*BUILD_STYLE_START*/
function buildStyle(P, terrain) {
  const name = ['coalesce', ['get', 'name:en'], ['get', 'name']];
  const label = (id, filter, size, font, extra) => {
    const layer = {
      id, type: 'symbol', source: 'omt', 'source-layer': 'place', filter,
      layout: { 'text-field': name, 'text-font': [font], 'text-size': size, 'text-max-width': 6, 'symbol-sort-key': ['get', 'rank'] },
      paint: { 'text-color': P.label, 'text-halo-color': P.halo, 'text-halo-width': 1.6 }
    };
    return Object.assign(layer, extra || {});
  };
  const lc = (cls, color) => ({ id: 'cover-' + cls, type: 'fill', source: 'omt', 'source-layer': 'landcover',
    filter: ['==', 'class', cls], paint: { 'fill-color': color } });

  const sources = {
    omt: {
      type: 'vector',
      url: 'https://tiles.openfreemap.org/planet',
      attribution: '<a href="https://openfreemap.org" target="_blank">OpenFreeMap</a> <a href="https://www.openmaptiles.org/" target="_blank">&copy; OpenMapTiles</a> Data from <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a>'
    }
  };
  const layers = [
    { id: 'background', type: 'background', paint: { 'background-color': P.land } },
    lc('grass', P.grass), lc('wetland', P.wetland), lc('farmland', P.farmland), lc('wood', P.forest), lc('ice', P.ice)
  ];
  if (terrain) {
    sources.dem = {
      type: 'raster-dem', encoding: 'terrarium', tileSize: 256, maxzoom: 12,
      tiles: ['https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png'],
      attribution: 'Terrain: Mapzen, AWS'
    };
    layers.push({ id: 'shade', type: 'hillshade', source: 'dem',
      paint: { 'hillshade-exaggeration': 0.35, 'hillshade-shadow-color': '#6f7d5a', 'hillshade-highlight-color': '#ffffff', 'hillshade-accent-color': '#8d9a78' } });
  }
  layers.push(
    { id: 'water', type: 'fill', source: 'omt', 'source-layer': 'water', paint: { 'fill-color': P.ocean } },
    { id: 'border-state', type: 'line', source: 'omt', 'source-layer': 'boundary', minzoom: 4,
      filter: ['all', ['==', 'admin_level', 4], ['==', 'maritime', 0]],
      paint: { 'line-color': P.borders, 'line-width': 0.7, 'line-opacity': 0.7, 'line-dasharray': [3, 2] } },
    { id: 'border-country', type: 'line', source: 'omt', 'source-layer': 'boundary',
      filter: ['all', ['==', 'admin_level', 2], ['==', 'maritime', 0]],
      paint: { 'line-color': P.borders, 'line-width': ['interpolate', ['linear'], ['zoom'], 1, 0.6, 6, 1.8] } },
    { id: 'label-water', type: 'symbol', source: 'omt', 'source-layer': 'water_name',
      filter: ['in', ['get', 'class'], ['literal', ['ocean', 'sea']]],
      layout: { 'text-field': name, 'text-font': ['Noto Sans Regular'], 'text-size': ['interpolate', ['linear'], ['zoom'], 1, 12, 6, 20],
                'text-letter-spacing': 0.3, 'text-max-width': 4 },
      paint: { 'text-color': P.oceanText } },
    label('label-country', ['==', ['get', 'class'], 'country'], ['interpolate', ['linear'], ['zoom'], 1, 11, 5, 19], 'Noto Sans Bold', { maxzoom: 8 }),
    label('label-city', ['==', ['get', 'class'], 'city'], ['interpolate', ['linear'], ['zoom'], 4, 11, 10, 18], 'Noto Sans Regular', { minzoom: 3.5 }),
    label('label-town', ['==', ['get', 'class'], 'town'], ['interpolate', ['linear'], ['zoom'], 7, 11, 12, 15], 'Noto Sans Regular', { minzoom: 7 })
  );

  return {
    version: 8,
    name: 'Office map',
    projection: { type: 'globe' },
    sky: {
      'sky-color': P.glow, 'horizon-color': '#ffffff', 'fog-color': P.glow,
      'sky-horizon-blend': 0.6, 'horizon-fog-blend': 0.6, 'fog-ground-blend': 0.5,
      'atmosphere-blend': ['interpolate', ['linear'], ['zoom'], 0, 1, 5, 1, 7, 0]
    },
    glyphs: 'https://tiles.openfreemap.org/fonts/{fontstack}/{range}.pbf',
    sources, layers
  };
}
/*BUILD_STYLE_END*/

const $ = id => document.getElementById(id);
const notice = msg => { $('notice').textContent = msg; $('notice').classList.add('show'); };
const P = PALETTE;

const root = document.documentElement.style;
root.setProperty('--accent', P.accent);
root.setProperty('--card-bg', P.cardBg);
root.setProperty('--ink', P.ink);
root.setProperty('--ink-soft', P.inkSoft);
root.setProperty('--space', P.space);
root.setProperty('--dwell', SETTINGS.dwellSeconds + 's');
if (!SETTINGS.showList) $('list').style.display = 'none';

/* Stars behind the globe */
(() => {
  const s = [];
  for (let i = 0; i < 220; i++) {
    s.push(`${(Math.random() * 100).toFixed(2)}vw ${(Math.random() * 100).toFixed(2)}vh 0 ${Math.random() < 0.15 ? 1 : 0}px rgba(255,255,255,${(0.25 + Math.random() * 0.6).toFixed(2)})`);
  }
  $('stars').style.boxShadow = s.join(',');
})();

const dwellMs = SETTINGS.dwellSeconds * 1000;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

let map, loaded = false;
try {
  map = new maplibregl.Map({
    container: 'map',
    style: buildStyle(P, SETTINGS.terrainShading),
    center: SETTINGS.overview.center,
    zoom: SETTINGS.overview.zoom,
    attributionControl: { compact: true }
  });
} catch (err) {
  notice('This browser cannot display the map. Try a current version of Chrome, Edge, Firefox or Safari.');
  throw err;
}

/* If the internet drops while loading, try again in a minute */
map.on('error', () => { if (!loaded) setTimeout(() => location.reload(), 60000); });

let idx = -1, tourTimer = null, resumeTimer = null, paused = false;
const pins = [], buttons = [];

LOCATIONS.forEach((loc, i) => {
  const el = document.createElement('div');
  el.className = 'pin';
  el.title = loc.title;
  el.addEventListener('click', ev => { ev.stopPropagation(); userSelect(i); });
  new maplibregl.Marker({ element: el }).setLngLat(loc.coordinates).addTo(map);
  pins.push(el);

  const b = document.createElement('button');
  b.textContent = loc.title;
  b.addEventListener('click', () => userSelect(i));
  $('list').appendChild(b);
  buttons.push(b);
});

function setText(id, text) {
  const el = $(id);
  el.textContent = text || '';
  el.style.display = text ? '' : 'none';
}

function showCard(loc) {
  const card = $('card'), bar = $('bar');
  card.classList.add('swap');
  setTimeout(() => {
    setText('c-title', loc.title);
    setText('c-sub', loc.subtitle);
    setText('c-blurb', loc.blurb);
    const facts = $('c-facts');
    facts.innerHTML = '';
    facts.style.display = (loc.facts && loc.facts.length) ? '' : 'none';
    (loc.facts || []).forEach(([v, l]) => {
      const li = document.createElement('li');
      const s = document.createElement('strong'); s.textContent = v;
      li.append(s, l);
      facts.appendChild(li);
    });
    card.classList.remove('swap');
  }, reduceMotion ? 0 : 300);

  bar.classList.remove('run'); void bar.offsetWidth;
  if (!paused) bar.classList.add('run');
}

function setActive(i) {
  pins.forEach((p, n) => p.classList.toggle('active', n === i));
  buttons.forEach((b, n) => b.classList.toggle('active', n === i));
}

function fly(opts) {
  map.flyTo(Object.assign({ essential: true, curve: 1.5, speed: reduceMotion ? 5 : 0.7, maxDuration: 6000 }, opts));
}

function goTo(i) {
  idx = (i + LOCATIONS.length) % LOCATIONS.length;
  const loc = LOCATIONS[idx];
  setActive(idx);
  showCard(loc);
  fly({ center: loc.coordinates, zoom: loc.zoom || 5, pitch: 0, bearing: 0 });
}

function step() {
  goTo(idx + 1);
  tourTimer = setTimeout(step, dwellMs);
}

function startTour() {
  paused = false;
  clearTimeout(tourTimer);
  step();
}

function pauseTour() {
  paused = true;
  clearTimeout(tourTimer);
  $('bar').classList.remove('run');
  clearTimeout(resumeTimer);
  resumeTimer = setTimeout(() => {
    fly({ center: SETTINGS.overview.center, zoom: SETTINGS.overview.zoom, pitch: 0, bearing: 0 });
    setActive(-1);
    tourTimer = setTimeout(startTour, 5000);
  }, SETTINGS.idleResumeSeconds * 1000);
}

function userSelect(i) { pauseTour(); goTo(i); }

/* Real user gestures pause the tour (automatic moves have no originalEvent) */
map.on('movestart', e => { if (e.originalEvent) pauseTour(); });

/* Keyboard: left/right arrows change location, space pauses/resumes */
addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') userSelect(idx + 1);
  else if (e.key === 'ArrowLeft') userSelect(idx - 1);
  else if (e.key === ' ') { e.preventDefault(); if (paused) { clearTimeout(resumeTimer); startTour(); } else pauseTour(); }
});

/* Hide the mouse cursor after a few seconds of stillness */
let cursorTimer;
addEventListener('mousemove', () => {
  document.body.classList.remove('idle-cursor');
  clearTimeout(cursorTimer);
  cursorTimer = setTimeout(() => document.body.classList.add('idle-cursor'), 5000);
});

setTimeout(() => location.reload(), SETTINGS.reloadEveryHours * 3600 * 1000);

map.on('load', () => { loaded = true; setTimeout(startTour, 1500); });
</script>
</body>
</html>
